# Стиль кода проекта: PEP 8, строки до 120 символов, одинарные кавычки.
line-length = 120
target-version = "py312"

[format]
quote-style = "single"

[lint]
# E/W - pycodestyle, F - pyflakes (неиспользуемые импорты и переменные), I - порядок импортов
select = ["E", "W", "F", "I"]

[lint.isort]
known-first-party = ["src", "experiments"]
